name: Build iOS IPA (unsigned)

# Builds an unsigned .ipa on a macOS runner. Sign and install it from
# Windows with Sideloadly or AltStore using a free Apple ID; see
# docs/TESTING_ON_LG.md. Download it from the run's Artifacts.
on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Runner.app without code signing
        run: flutter build ios --release --no-codesign
      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr tv-remote-free-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: tv-remote-free-ipa
          path: tv-remote-free-unsigned.ipa
          retention-days: 30
