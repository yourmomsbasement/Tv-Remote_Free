name: Release iOS to App Store Connect

# Signs and uploads a build to App Store Connect (TestFlight / App Store)
# from a macOS runner, so no Mac is needed. Run it manually from Actions.
# Signing is automatic via an App Store Connect API key (Admin role); see
# docs/STORE_SUBMISSION.md for creating the key and the secrets.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64 TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret for $v. See docs/STORE_SUBMISSION.md."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      # App Store uploads must be built with a current Xcode SDK.
      - name: Use the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Install the API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Build Flutter for release
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Export and upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf ~/.appstoreconnect
